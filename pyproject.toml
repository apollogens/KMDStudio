[project]
name = "kmdstudio"
version = "0.6.0rc1"
description = "Local Agent Skill for designed editable DOCX and PDF documents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf==7.2.0"]
raster = ["Pillow==13.0.0"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
